# Đặc tả project cho XcodeGen (https://github.com/yonaskolb/XcodeGen).
# CI chạy `xcodegen generate` để tạo Cozyday.xcodeproj — không sửa project.pbxproj bằng tay
# và không commit thư mục .xcodeproj (đã có trong .gitignore).
name: Cozyday

options:
  bundleIdPrefix: com.phuhot
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Cozyday:
    type: application
    platform: iOS
    sources:
      - path: Cozyday
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Cozyday
        PRODUCT_BUNDLE_IDENTIFIER: com.phuhot.cozyday
        INFOPLIST_FILE: Cozyday/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Không có entitlements: không iCloud, không push, không App Groups.
        CODE_SIGN_ENTITLEMENTS: ""

  CozydayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: Cozyday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phuhot.cozyday.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cozyday:
    build:
      targets:
        Cozyday: all
        CozydayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CozydayTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
