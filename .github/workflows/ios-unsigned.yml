# Build IPA chưa ký cho iPhone thật trên runner macOS của GitHub.
#
# Cách chạy chủ động: tab Actions → "iOS unsigned IPA" → Run workflow.
# Push lên nhánh main KHÔNG tự chạy (tiết kiệm phút macOS). Riêng nhánh claude/** (nhánh
# Claude dùng để phát triển) tự chạy khi đổi code/cấu hình build — không chạy khi chỉ sửa docs.
# Ảnh giao diện: job test luôn chụp và upload artifact; chỉ commit ảnh vào docs/screenshots khi
# commit message có "[ui-preview]" hoặc khi Run workflow có tick "Chụp ảnh giao diện".
name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chạy thêm unit test trên iOS Simulator (tốn thêm phút macOS)"
        type: boolean
        default: false
      ui_preview:
        description: "Chụp ảnh giao diện trên iOS Simulator và lưu vào docs/screenshots"
        type: boolean
        default: false
  push:
    branches:
      - "claude/**"
    paths:
      - "Cozyday/**"
      - "Tests/**"
      - "project.yml"
      - "scripts/ci/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  # Đã đối chiếu actions/runner-images (macos-26-arm64, image 20260907): có Xcode 26.6 + iOS SDK 26.5.
  XCODE_VERSION: "26.6"
  XCODEGEN_VERSION: "2.46.0"
  # SHA-256 của xcodegen.zip bản 2.46.0 tải từ GitHub Releases chính thức.
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  device-ipa:
    name: Build IPA (iphoneos arm64, chưa ký)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Lấy source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Chọn Xcode ${{ env.XCODE_VERSION }}
        run: scripts/ci/select_xcode.sh

      - name: Cài XcodeGen ${{ env.XCODEGEN_VERSION }} (kiểm SHA-256)
        run: scripts/ci/install_xcodegen.sh

      - name: In phiên bản công cụ
        run: scripts/ci/print_toolchain.sh

      - name: Tạo Xcode project từ project.yml
        run: scripts/ci/generate_project.sh

      - name: Build Release cho thiết bị + đóng gói IPA
        run: scripts/ci/build_unsigned_ipa.sh

      - name: Kiểm tra cấu trúc IPA
        run: scripts/ci/verify_ipa.sh

      - name: Upload IPA + checksum + thông tin build
        uses: actions/upload-artifact@v7
        with:
          name: Cozyday-unsigned-ipa-run${{ github.run_number }}
          path: |
            build/output/Cozyday-unsigned.ipa
            build/output/Cozyday-unsigned.ipa.sha256
            build/output/build-info.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-device-run${{ github.run_number }}
          path: |
            build/logs/
            build/toolchain.txt
          if-no-files-found: ignore
          retention-days: 7

  simulator-tests:
    name: Unit test + ảnh giao diện trên iOS Simulator
    if: github.event_name == 'push' || inputs.run_tests || inputs.ui_preview
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Lấy source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Chọn Xcode ${{ env.XCODE_VERSION }}
        run: scripts/ci/select_xcode.sh

      - name: Cài XcodeGen ${{ env.XCODEGEN_VERSION }} (kiểm SHA-256)
        run: scripts/ci/install_xcodegen.sh

      - name: In phiên bản công cụ
        run: scripts/ci/print_toolchain.sh

      - name: Tạo Xcode project từ project.yml
        run: scripts/ci/generate_project.sh

      - name: Chạy test
        run: scripts/ci/run_simulator_tests.sh

      - name: Chụp ảnh giao diện (dữ liệu mẫu, bản Debug)
        run: scripts/ci/capture_screenshots.sh

      - name: Upload ảnh giao diện
        uses: actions/upload-artifact@v7
        with:
          name: Cozyday-ui-screenshots-run${{ github.run_number }}
          path: build/screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload bản .app cho simulator
        uses: actions/upload-artifact@v7
        with:
          name: Cozyday-simulator-app-run${{ github.run_number }}
          path: build/output/Cozyday-simulator-app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload log test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-tests-run${{ github.run_number }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

  publish-screenshots:
    name: Lưu ảnh giao diện vào docs/screenshots
    needs: simulator-tests
    if: inputs.ui_preview || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-preview]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Lấy source (đầu nhánh hiện tại)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Tải ảnh từ job simulator
        uses: actions/download-artifact@v8
        with:
          name: Cozyday-ui-screenshots-run${{ github.run_number }}
          path: build/screenshots

      - name: Commit ảnh
        env:
          BRANCH: ${{ github.ref_name }}
        run: scripts/ci/publish_screenshots.sh
